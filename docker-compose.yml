# AstraMentor：一个镜像、一个容器、一个端口。
#
#   echo 'ASTRA_API_KEY=sk-你的Kimi密钥' > .env
#   docker compose up -d
#   打开 http://<这台机器的地址>:8000
#
# 只提供 HTTP。要 HTTPS、自定义域名、限速之类的，在前面自己套一层
# nginx / Caddy / Traefik 反代即可 —— uvicorn 已经开了 --proxy-headers，
# 会正确识别反代传来的 X-Forwarded-For / X-Forwarded-Proto。
#
# 模型默认就是 Kimi K3、推理强度 low，所以 .env 里只需要一个 API Key。
# 想换模型就覆盖 ASTRA_PROVIDER / ASTRA_API_ENDPOINT / ASTRA_MODEL_NAME。

services:
  astramentor:
    # 想自己构建就把 image 换成 build: .
    image: ghcr.io/dann2333/astramentor-v1:latest
    container_name: astramentor
    restart: unless-stopped

    ports:
      # 只监听本机的话改成 "127.0.0.1:8000:8000"，然后让反代去连它
      - "8000:8000"

    # .env 里放 ASTRA_API_KEY 就够了，其余默认值都在镜像里
    env_file:
      - .env

    environment:
      # ── 想开到公网时建议打开的两项 ──────────────────────
      # 整站强制登录（默认 true，也就是允许匿名访客）
      ASTRA_ALLOW_ANONYMOUS: ${ASTRA_ALLOW_ANONYMOUS:-true}
      # 关掉自助注册后，用
      #   docker compose exec astramentor python -m services.bootstrap_admin <用户名>
      # 在服务端建号
      ASTRA_REGISTRATION_ENABLED: ${ASTRA_REGISTRATION_ENABLED:-true}

      # 撞库防护
      ASTRA_AUTH_MAX_FAILED_ATTEMPTS: ${ASTRA_AUTH_MAX_FAILED_ATTEMPTS:-5}
      ASTRA_AUTH_LOCKOUT_MINUTES: ${ASTRA_AUTH_LOCKOUT_MINUTES:-30}

      # 在线 IDE 的代码执行。现在提交上来的代码一律关在 bubblewrap 沙箱里
      # 跑（无网络、看不到 /app 和 /data、环境变量清空），所以可以放心开着。
      # 沙箱起不来时服务会直接拒绝执行，不会偷偷降级成裸 subprocess。
      ASTRA_CODE_RUNNER_ENABLED: ${ASTRA_CODE_RUNNER_ENABLED:-true}

    volumes:
      # SQLite 库和上传的 PDF 都在这儿，容器重建不丢
      - astramentor-data:/data
      # 课程索引要能重建（教材更新后前端会提示 stale）。用具名卷而不是直接
      # 写镜像里的目录：Docker 会在卷为空时把镜像里那份已构建好的索引拷进来，
      # 所以第一次启动就带着 5 门课的索引，之后重建也存得下。
      - astramentor-indexes:/app/rag/indexes

    # 根文件系统只读：应用只往上面两个卷和 /tmp 写。
    read_only: true
    tmpfs:
      # 沙箱的工作目录、PDF 解析、jieba 分词缓存都落在这里。
      # 这也顺带给沙箱的写入量定了上限。
      - /tmp:size=512m,mode=1777
      # 有些库会往 HOME 下的 cache 里写东西，给它一块内存盘兜着
      - /home/astra/.cache:size=64m

    security_opt:
      - no-new-privileges:true
      # ── 在线 IDE 的沙箱要用的三项 ───────────────────────────
      # 沙箱靠内核的非特权 user namespace，而 Docker 的默认策略正好层层
      # 挡在这条路上：seccomp 挡住建 namespace，AppArmor 挡住 mount，
      # masked /proc 挡住挂 procfs。默认配置下沙箱起不来 —— 服务会明确
      # 拒绝执行代码、不会裸跑，只是在线 IDE 用不了。
      #
      # 要用在线 IDE，先跑一句看你这台机器需要哪一档：
      #     bash scripts/check-sandbox.sh
      # 然后按它的结论去掉下面对应几行的注释。Ubuntu 23.10 起还需要在宿主
      # 上放开 kernel.apparmor_restrict_unprivileged_userns，脚本会提示。
      #
      # 这三项只放开这一个容器的 LSM 约束，**不授予任何 capability**
      # （cap_drop: ALL 仍然生效）；实测加 capability 乃至 --privileged 都
      # 换不来任何东西，所以别动 cap_drop。
      # - seccomp=unconfined
      # - apparmor=unconfined
      # - systempaths=unconfined
    cap_drop:
      - ALL

    # 沙箱里的 fork 炸弹困在自己的 pid 命名空间里，但容器级的上限再兜一层
    pids_limit: 512
    mem_limit: 2g

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/courses"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  astramentor-data:
  astramentor-indexes:
