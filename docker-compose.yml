# 最省事的跑法（只需要一个 Key）：
#   1. echo 'ASTRA_API_KEY=sk-你的Kimi密钥' > .env
#   2. docker compose up -d
#   3. 打开 http://localhost:8000
#
# 模型默认就是 Kimi K3（provider/endpoint/model/推理强度都写在镜像里了），
# 想换别的模型在 .env 里覆盖 ASTRA_PROVIDER / ASTRA_API_ENDPOINT /
# ASTRA_MODEL_NAME 即可。
#
# 想直接用 GitHub Actions 构建好的现成镜像，把 build 段删掉、
# image 改成 ghcr.io/dann2333/astramentor-v1:latest。

services:
  astramentor:
    build:
      context: .
      # 本地构建只出当前机器的架构。要多架构镜像用 buildx，见 README。
      dockerfile: Dockerfile
    image: astramentor:local
    container_name: astramentor
    restart: unless-stopped
    ports:
      - "8000:8000"
    # .env 里只放 ASTRA_API_KEY 就够了；其余默认值都在镜像里
    env_file:
      - .env
    volumes:
      - astramentor-data:/data
    # 在线 IDE 会执行使用者写的代码。这几项不是"安全沙箱"，只是把
    # 容器逃逸和资源打满的门槛抬高一点；真要对外开放请另外做隔离。
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g

volumes:
  astramentor-data:
